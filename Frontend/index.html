<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple personal expense tracker. Add, review, filter, and update expenses.">
  <title>Expense Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark main-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <span class="brand-icon">E</span>
        Expense Tracker
      </a>



</div>


  </nav>

  <main class="container py-4 py-lg-5">


<div id="alert-area" aria-live="polite"></div>

<section aria-labelledby="summary-heading" class="mb-4">

  <div class="section-heading mb-3">
    <div>
      <p class="section-eyebrow mb-1">OVERVIEW</p>
      <h1 id="summary-heading" class="h3 mb-0">Your expenses</h1>
    </div>

    <span class="summary-period">
      All-time summary
    </span>
  </div>

  <div class="summary-grid">

    <article class="card summary-card total-card border-0">
      <div class="card-body">
        <div class="summary-icon">💰</div>
        <p class="summary-label">Total amount</p>
        <p id="summary-total" class="summary-value mb-0">$0.00</p>
      </div>
    </article>

    <article class="card summary-card count-card border-0">
      <div class="card-body">
        <div class="summary-icon">📊</div>
        <p class="summary-label">Number of expenses</p>
        <p id="summary-count" class="summary-value mb-0">0</p>
      </div>
    </article>

    <article class="card summary-card highest-card border-0">
      <div class="card-body">
        <div class="summary-icon">⭐</div>
        <p class="summary-label">Highest expense</p>
        <p id="summary-highest" class="summary-value mb-0">$0.00</p>
      </div>
    </article>

  </div>
</section>


<section class="card main-card border-0 mb-4" aria-labelledby="add-heading">

  <div class="card-body p-3 p-md-4">



    <form id="add-form" class="row g-3">

      <div class="col-12 col-md-6 col-lg-3">
        <label for="add-title" class="form-label">Title</label>
        <input
          id="add-title"
          name="title"
          class="form-control"
          type="text"
          maxlength="100"
          placeholder="e.g. Groceries"
          required
        >
      </div>

      <div class="col-12 col-md-6 col-lg-2">
        <label for="add-amount" class="form-label">Amount</label>
        <input
          id="add-amount"
          name="amount"
          class="form-control"
          type="number"
          min="0.01"
          step="0.01"
          placeholder="0.00"
          required
        >
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <label for="add-category" class="form-label">Category</label>

        <select
          id="add-category"
          name="category"
          class="form-select"
          required
        >
          <option value="" selected disabled>Choose a category</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>

      <div class="col-12 col-md-6 col-lg-2">
        <label for="add-date" class="form-label">Date</label>

        <input
          id="add-date"
          name="date"
          class="form-control"
          type="date"
          required
        >
      </div>

      <div class="col-12 col-lg-2 d-flex align-items-end">
        <button
          id="add-submit"
          type="submit"
          class="btn btn-primary add-button w-100"
        >
          Add expense
        </button>
      </div>

    </form>

  </div>
</section>


<section class="card main-card border-0" aria-labelledby="list-heading">

  <div class="card-body p-3 p-md-4">

    <div class="list-heading mb-4">

      <div>
        <p class="section-eyebrow mb-1">TRANSACTIONS</p>
        <h2 id="list-heading" class="h5 mb-0">Expense list</h2>
      </div>

      <div class="filter-wrapper">
        <label
          for="category-filter"
          class="form-label mb-0 small"
        >
          Filter by
        </label>

        <select
          id="category-filter"
          class="form-select form-select-sm filter-select"
        >
          <option value="All">All</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>

    </div>


    <div
      id="loading-indicator"
      class="loading-box text-center py-5"
      role="status"
      hidden
    >
      <div
        class="spinner-border text-primary"
        aria-hidden="true"
      ></div>

      <p class="mt-3 mb-0 text-secondary">
        Loading expenses…
      </p>
    </div>


    <div class="table-responsive" id="table-container">

      <table class="table expense-table align-middle mb-0">

        <thead>
          <tr>
            <th scope="col">Title</th>
            <th scope="col">Amount</th>
            <th scope="col">Category</th>
            <th scope="col">Date</th>
            <th scope="col" class="actions-heading">Actions</th>
          </tr>
        </thead>

        <tbody id="expense-rows"></tbody>

      </table>

    </div>


    <p
      id="empty-state"
      class="empty-state text-center text-secondary py-5 mb-0"
      hidden
    >
      No expenses to show. Add one above to get started.
    </p>

  </div>
</section>


  </main>

  <div
    class="modal fade"
    id="edit-modal"
    tabindex="-1"
    aria-labelledby="edit-modal-title"
    aria-hidden="true"
  >


<div class="modal-dialog modal-dialog-centered">

  <div class="modal-content edit-modal-content">

    <form id="edit-form">

      <div class="modal-header">

        <div>
          <p class="section-eyebrow mb-1">UPDATE</p>

          <h2
            class="modal-title fs-5"
            id="edit-modal-title"
          >
            Edit expense
          </h2>
        </div>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>

      </div>


      <div class="modal-body">

        <input id="edit-id" type="hidden">

        <div class="mb-3">
          <label for="edit-title" class="form-label">
            Title
          </label>

          <input
            id="edit-title"
            class="form-control"
            type="text"
            maxlength="100"
            required
          >
        </div>


        <div class="mb-3">

          <label for="edit-amount" class="form-label">
            Amount
          </label>

          <input
            id="edit-amount"
            class="form-control"
            type="number"
            min="0.01"
            step="0.01"
            required
          >

        </div>


        <div class="mb-3">

          <label for="edit-category" class="form-label">
            Category
          </label>

          <select
            id="edit-category"
            class="form-select"
            required
          >
            <option>Food</option>
            <option>Transport</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Other</option>
          </select>

        </div>


        <div>

          <label for="edit-date" class="form-label">
            Date
          </label>

          <input
            id="edit-date"
            class="form-control"
            type="date"
            required
          >

        </div>

      </div>


      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-light"
          data-bs-dismiss="modal"
        >
          Cancel
        </button>

        <button
          id="edit-submit"
          type="submit"
          class="btn btn-primary"
        >
          Save changes
        </button>

      </div>

    </form>

  </div>

</div>


  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="app.js"></script>

</body>
</html>
